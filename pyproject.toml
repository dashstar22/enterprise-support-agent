[project]
name = "enterprise-support-agent"
version = "0.1.0"
description = "Evidence-grounded enterprise equipment support agent"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16,<2.0",
    "fastapi>=0.116,<1.0",
    "numpy>=1.21,<2.5",
    "opencv-python>=4.6,<5.0",
    "pydantic-settings>=2.0,<3.0",
    "pymupdf>=1.24,<2.0",
    "rapidocr-onnxruntime>=1.4,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn>=0.35,<1.0",
    "langgraph>=0.6,<1.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.0,<3.0",
    "mypy>=1.15,<2.0",
    "pytest>=8.0,<9.0",
    "ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
allowed-confusables = ["，"]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.mypy]
files = ["app", "tests"]
plugins = ["pydantic.mypy"]
python_version = "3.11"
show_error_codes = true
strict = true
